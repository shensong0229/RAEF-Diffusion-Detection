seed: 42
image_size: 256
epochs: 18
batch_size: 2
grad_accum_steps: 4
num_workers: 4
amp: true

model:
  # The SDV5 experiment launcher overrides this for each fusion control.
  name: sfire_crossattn_resnet50
  pretrained: false
  dropout: 0.10

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

sched:
  warmup_epochs: 1
  min_lr: 1.0e-6

dualstream:
  spatial_ckpt: .\checkpoints\paper_sdv5_spatial_seed42\best_by_auc.pth
  fire_ckpt: .\checkpoints\paper_sdv5_fire_seed42\best_by_auc.pth
  freeze_backbones_epochs: 2
  save_freq: 0
  aux_spatial_weight: 0.30
  aux_fire_weight: 0.30
  contrastive_weight: 0.05
  contrastive_temp: 0.07
  router_balance_weight: 0.02
  router_entropy_weight: 0.005
  branch_init_strict: true

data:
  missing_policy: strict
  preflight_sample_count: 1000
  preflight_min_ok_ratio: 1.0

runtime:
  disable_vae_slicing: false
  disable_vae_tiling: false
