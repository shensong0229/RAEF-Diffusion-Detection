seed: 42
image_size: 256
epochs: 18
batch_size: 8
grad_accum_steps: 2
num_workers: 8
amp: false

model:
  # The launcher overrides this name for each capacity-controlled variant.
  name: sfire_crossattn_resnet50
  pretrained: false
  dropout: 0.10

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

sched:
  warmup_epochs: 1
  min_lr: 1.0e-6

dualstream:
  spatial_ckpt: .\checkpoints\run_spatial_imagenet_adm_256\best_by_auc.pth
  fire_ckpt: .\checkpoints\run_fire_imagenet_adm_a30_std_fg\best_by_auc.pth
  freeze_backbones_epochs: 2
  save_freq: 1
  aux_spatial_weight: 0.30
  aux_fire_weight: 0.30
  contrastive_weight: 0.05
  contrastive_temp: 0.07
  router_balance_weight: 0.02
  router_entropy_weight: 0.005
  branch_init_strict: false

data:
  missing_policy: strict
  preflight_sample_count: 500
  preflight_min_ok_ratio: 0.98
