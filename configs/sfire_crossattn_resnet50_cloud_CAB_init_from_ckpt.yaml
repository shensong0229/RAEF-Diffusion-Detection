seed: 42

image_size: 256
epochs: 6
batch_size: 8
grad_accum_steps: 2
num_workers: 12
amp: false

model:
  name: sfire_crossattn_resnet50
  pretrained: false
  dropout: 0.10

optim:
  lr: 4.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

sched:
  warmup_epochs: 1
  min_lr: 1.0e-6

dualstream:
  spatial_ckpt: /mnt/proj/FakeImageDetect/checkpoints/run_spatial_imagenet_adm_256/best_by_auc.pth
  fire_ckpt: /mnt/proj/FakeImageDetect/checkpoints/run_fire_imagenet_adm_a30_std_fg/best_by_auc.pth
  init_ckpt: ""

  freeze_backbones_epochs: 0
  save_freq: 1

  aux_spatial_weight: 0.20
  aux_fire_weight: 0.05
  contrastive_weight: 0.008
  contrastive_temp: 0.07
  router_balance_weight: 0.005
  router_entropy_weight: 0.001
  router_sup_weight: 0.02
  router_sup_temp: 1.0

  branch_init_strict: false

data:
  missing_policy: strict
  preflight_sample_count: 500
  preflight_min_ok_ratio: 0.98
