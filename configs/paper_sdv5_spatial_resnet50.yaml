seed: 42
image_size: 256
epochs: 8
batch_size: 32
grad_accum_steps: 1
num_workers: 4
amp: true

model:
  name: spatial_resnet50
  pretrained: true
  dropout: 0.20

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

sched:
  warmup_epochs: 1
  min_lr: 1.0e-6

# save_freq is shared by the trainer. Zero prevents a large checkpoint for
# every epoch; latest/last and best_by_auc are still written.
dualstream:
  save_freq: 0

data:
  missing_policy: strict
  preflight_sample_count: 1000
  preflight_min_ok_ratio: 1.0
